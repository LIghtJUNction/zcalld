name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, or full commit SHA for a release candidate
        required: true
        type: string
      candidate:
        description: Validate and retain candidate artifacts without publishing
        type: boolean
        default: false
      platform:
        description: Candidate validation platform (formal releases always use all five)
        type: choice
        default: all
        options: [all, windows]
  workflow_call:
    inputs:
      tag:
        description: Exact release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zcalld-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Target selection only narrows candidates; every formal release keeps all five.
        # The selected OS still executes its complete build, runtime and archive checks.
        include: ${{ fromJSON(inputs.candidate && inputs.platform == 'windows' && '[{"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]' || '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc"},{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CANDIDATE: ${{ inputs.candidate || false }}
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libzstd-dev zlib1g-dev pkg-config shellcheck libsystemd-dev dbus
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Install native toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Prepare the macOS static request decoder
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list --versions zstd >/dev/null || brew install zstd
          codec_root="$(brew --prefix zstd)"
          test -f "$codec_root/lib/libzstd.a"
          printf 'RUSTFLAGS=-L native=%s/lib\n' "$codec_root" >> "$GITHUB_ENV"
      - name: Prepare Windows TLS transport
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-transport
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: extensions/compat/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Build native optional helpers for acceptance
        shell: bash
        working-directory: extensions/compat
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../_release/native-compat
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          go build -mod=readonly -trimpath -o "../../_release/native-compat/zcalld-pluginctl$suffix" ./cmd/zcalld-pluginctl
          go build -mod=readonly -trimpath -o "../../_release/native-compat/zcalld-privacy$suffix" ./cmd/zcalld-privacy
          go build -mod=readonly -trimpath -o "../../_release/native-compat/zcalld-claude-tui$suffix" ./cmd/zcalld-claude-tui
          go test -mod=readonly -c -o "../../_release/native-compat/fake-claude$suffix" ./internal/claudetui
      - name: Verify the immutable source
        shell: bash
        run: |
          if [[ "$CANDIDATE" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$RELEASE_TAG"
            python3 scripts/release.py check
          else
            python3 scripts/release.py verify-ref "$RELEASE_TAG"
          fi
      - name: Build and validate optional native notification identities
        shell: bash
        run: |
          python3 plugins/desktop/native/test-build.py
          python3 plugins/desktop/native/build.py --out-dir target/release/desktop-native --self-test
      - name: Run Linux release checks
        if: runner.os == 'Linux'
        run: ./scripts/check.sh
      - name: Check Windows and macOS native binaries
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build --release --workspace --locked
          cargo build --release --locked -p zcalld-plugin-routing --example recovery-fixture
          python3 scripts/test-recovery.py
          ./target/release/zcalld --version
          if [[ -f target/release/zcalld.exe ]]; then
            export ZCALLD_TEST_BINARY=target/release/zcalld.exe
          else
            export ZCALLD_TEST_BINARY=target/release/zcalld
          fi
          python3 scripts/test-control.py
          python3 scripts/test-keys.py
          python3 scripts/test-library.py
          python3 scripts/test-transport.py --binary "$ZCALLD_TEST_BINARY"
          python3 scripts/test-native-runtime.py --binary "$ZCALLD_TEST_BINARY"
      - name: Verify native privacy, routing, MCP and builtin provider workers
        shell: bash
        run: python3 scripts/test-native-compat.py
      - name: Assemble the native archive
        shell: bash
        run: python3 scripts/package.py --no-build --target '${{ matrix.target }}'
      - name: Verify full native archive installer
        shell: bash
        run: python3 scripts/test-installer.py --archive-dir dist
      - name: Assemble complete pinned sources
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/package.py --source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.candidate != true
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish immutable release assets and SHA256SUMS
        run: python3 scripts/release.py publish "$RELEASE_TAG"

  aur:
    needs: publish
    if: vars.AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate source and binary AUR packages from published files
        run: |
          python3 scripts/release.py verify-ref "$RELEASE_TAG"
          python3 scripts/release.py aur --download
      - name: Update AUR package repositories
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          keydir=$(mktemp -d "$RUNNER_TEMP/zcalld-aur.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          chmod 700 "$keydir"
          printf '%s\n' "$AUR_SSH_KEY" > "$keydir/key"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$keydir/known_hosts"
          chmod 600 "$keydir/key" "$keydir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $keydir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$keydir/known_hosts -o StrictHostKeyChecking=yes"
          python3 scripts/release.py publish-aur
