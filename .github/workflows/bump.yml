name: Bump and release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component
        type: choice
        options: [patch, minor, major, custom]
        default: patch
      version:
        description: Exact version for custom (MAJOR.MINOR.PATCH)
        type: string
        default: ''
      dry_run:
        description: Show the next version without changing or publishing anything
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zcalld-bump
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Prepare the pinned toolchain and registry dependencies
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo fetch --locked
      - name: Bump, commit and tag
        id: bump
        env:
          BUMP_KIND: ${{ inputs.bump }}
          BUMP_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=("$BUMP_KIND")
          if [[ -n "$BUMP_VERSION" ]]; then args+=(--version "$BUMP_VERSION"); fi
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          else
            args+=(--commit --tag)
          fi
          python3 scripts/release.py bump "${args[@]}"
          if [[ "$DRY_RUN" != true ]]; then
            python3 scripts/release.py push
            printf 'tag=v%s\n' "$(python3 scripts/release.py version)" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: inputs.dry_run == false
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
