name: Native desktop helpers
on:
  push:
    branches: [main]
    paths:
      - 'plugins/desktop/native/**'
      - '.github/workflows/desktop-native.yml'
  pull_request:
    paths:
      - 'plugins/desktop/native/**'
      - '.github/workflows/desktop-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the installed native compiler and notification identity
        shell: bash
        run: |
          python3 plugins/desktop/native/test-build.py
          python3 plugins/desktop/native/build.py --out-dir target/desktop-native --self-test
