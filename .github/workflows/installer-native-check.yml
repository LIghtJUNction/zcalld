name: Installer and desktop native candidate check

# Manual diagnostic gate only. This does not publish a release or replace
# the five native build and acceptance jobs in release.yml.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact candidate commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-native-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  installer-native:
    name: Installer and desktop candidate (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            id: windows-x86_64
            host: x86_64-pc-windows-msvc
          - runner: macos-15
            id: macos-aarch64
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
      EXPECTED_HOST: ${{ matrix.host }}
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Require an exact commit
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'commit must be an exact 40-character lowercase hexadecimal SHA' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{commit}")" = "$SOURCE_COMMIT"
          mkdir -p candidate-logs
          {
            echo 'candidate_only=true'
            echo "commit=$SOURCE_COMMIT"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "expected_host=$EXPECTED_HOST"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo 'logs=last_2097152_bytes_each'
          } > candidate-logs/source.txt

      - name: Install exact Rust toolchain
        id: toolchain
        run: |
          raw_log="$RUNNER_TEMP/zcalld-installer-toolchain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          set +e
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy > "$raw_log" 2>&1
          result=$?
          tail -c 2097152 "$raw_log" | tee candidate-logs/toolchain.log
          printf '%s\n' "$result" > candidate-logs/toolchain-exit-code.txt
          rm -f -- "$raw_log"
          if (( result != 0 )); then exit "$result"; fi
          set -e
          rustc -vV | tee candidate-logs/rustc.txt
          grep -Fx 'release: 1.100.0' candidate-logs/rustc.txt
          grep -Fx "host: $EXPECTED_HOST" candidate-logs/rustc.txt

      - name: Check installer and desktop formatting
        id: format
        run: |
          raw_log="$RUNNER_TEMP/zcalld-installer-format-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          set +e
          cargo fmt -p zcalld-installer -p zcalld-plugin-desktop -- --check > "$raw_log" 2>&1
          result=$?
          tail -c 2097152 "$raw_log" | tee candidate-logs/format.log
          printf '%s\n' "$result" > candidate-logs/format-exit-code.txt
          rm -f -- "$raw_log"
          exit "$result"

      - name: Check installer and desktop Clippy
        id: clippy
        run: |
          raw_log="$RUNNER_TEMP/zcalld-installer-clippy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          set +e
          cargo clippy -p zcalld-installer -p zcalld-plugin-desktop --all-targets --locked -- -D warnings > "$raw_log" 2>&1
          result=$?
          tail -c 2097152 "$raw_log" | tee candidate-logs/clippy.log
          printf '%s\n' "$result" > candidate-logs/clippy-exit-code.txt
          rm -f -- "$raw_log"
          exit "$result"

      - name: Test installer and desktop on the native OS
        id: tests
        run: |
          raw_log="$RUNNER_TEMP/zcalld-installer-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          set +e
          cargo test -p zcalld-installer -p zcalld-plugin-desktop --all-targets --locked > "$raw_log" 2>&1
          result=$?
          tail -c 2097152 "$raw_log" | tee candidate-logs/tests.log
          printf '%s\n' "$result" > candidate-logs/tests-exit-code.txt
          rm -f -- "$raw_log"
          exit "$result"

      - name: Record candidate outcome
        if: always()
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p candidate-logs
          {
            echo 'candidate_only=true'
            echo "toolchain=$TOOLCHAIN_OUTCOME"
            echo "format=$FORMAT_OUTCOME"
            echo "clippy=$CLIPPY_OUTCOME"
            echo "tests=$TEST_OUTCOME"
          } > candidate-logs/outcome.txt

      - name: Save bounded diagnostic logs and source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-native-candidate-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-logs/
          if-no-files-found: error
          retention-days: 7
