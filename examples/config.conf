# zcalld uses a strict INI-style configuration. Values may be quoted.
# Credentials come from environment variables; secret values stay out of this file.
[server]
listen = 127.0.0.1:9415
workers = 4
queue = 16
max_body_bytes = 4194304
max_response_bytes = 16777216
request_timeout_ms = 10000
upstream_timeout_ms = 300000
connect_timeout_ms = 10000
default_max_tokens = 4096
# token_env = ZCALLD_TOKEN

# Any HTTP(S) API implementing a supported protocol can be an upstream.
[provider local]
base_url = http://127.0.0.1:11434/v1
protocol = chat
# api_key_env = LOCAL_API_KEY

[route local]
provider = local
model = llama3.2

# [provider openai]
# base_url = https://api.openai.com/v1
# protocol = responses
# api_key_env = OPENAI_API_KEY
#
# [route coding]
# provider = openai
# model = your-model-id

# Plugins are opt-in trusted native libraries. Paths may be absolute or relative
# to this config file. Use config_file for multiline plugin configuration.
# [plugin aliases]
# path = /usr/lib/zcalld/plugins/libzcalld_aliases.so
# config = fast=local
#
# [plugin policy]
# path = /usr/lib/zcalld/plugins/libzcalld_policy.so
# config = allow=local
