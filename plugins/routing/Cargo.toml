[package]
name = "zcalld-plugin-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional request routing, decision providers and usage for zcalld"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2.workspace = true
zhex.workspace = true
zcalld-plugin-api = { path = "../../crates/zcalld-plugin-api", version = "=0.4.6" }
zplugin = { features = ["std"], git = "https://github.com/LIghtJUNction/zplugin.git"}
zconv = { default-features = false, git = "https://github.com/LIghtJUNction/zconv.git"}
zcalld-compat-client = { version = "=0.4.6", path = "../../crates/zcalld-compat-client" }

[[example]]
name = "recovery-fixture"
path = "examples/recovery_fixture.rs"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
zsys.workspace = true
