[package]
name = "zcalld-plugin-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Model allowlist and request limits for zcalld"

[lib]
name = "zcalld_policy"
crate-type = ["cdylib", "rlib"]

[dependencies]
zcalld-plugin-api = { path = "../../crates/zcalld-plugin-api", version = "=0.4.6" }
zplugin = { default-features = false, features = ["std", "macros"], git = "https://github.com/LIghtJUNction/zplugin.git"}
