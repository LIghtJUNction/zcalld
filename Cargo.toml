[workspace]
members = [".", "crates/zcalld-plugin-api", "crates/zcalld-compat-client", "plugins/aliases", "plugins/policy", "plugins/redact", "plugins/community", "plugins/routing"]
exclude = ["apps/zcall-gui", "extensions/compat", "vendor/zcall", "vendor/zconv", "vendor/zplugin", "vendor/zsys"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zcalld"

[package]
name = "zcalld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A compact native AI gateway built on zcall with optional zplugin extensions"
readme = "README.md"
keywords = ["ai", "gateway", "linux", "systemd", "plugins"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "examples/config.conf", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock", "extensions/builtin-providers.json"]

[dependencies]
zcall = { version = "=0.4.0", default-features = false, features = ["server"] }
zconv = { version = "=0.4.0", default-features = false }
zplugin = { version = "=0.3.1", features = ["std"] }
zcalld-plugin-api = { version = "=0.4.0", path = "crates/zcalld-plugin-api" }
zcalld-compat-client = { version = "=0.4.0", path = "crates/zcalld-compat-client" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[patch.crates-io]
zcall = { path = "vendor/zcall" }
zconv = { path = "vendor/zconv" }
zplugin = { path = "vendor/zplugin" }
zplugin-macros = { path = "vendor/zplugin/crates/zplugin-macros" }
zsys = { path = "vendor/zsys" }
