[workspace]
members = [".", "crates/zcalld-plugin-api", "crates/zcalld-compat-client", "crates/zcalld-installer", "plugins/aliases", "plugins/policy", "plugins/redact", "plugins/community", "plugins/routing", "plugins/desktop"]
exclude = ["apps/zcall-gui", "extensions/compat", "vendor/zcall", "vendor/zconv", "vendor/zplugin", "vendor/zsys"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zcalld"

[package]
name = "zcalld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A compact native AI gateway built on zcall with optional zplugin extensions"
readme = "README.md"
keywords = ["ai", "gateway", "linux", "systemd", "plugins"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "examples/config.conf", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock", "extensions/builtin-providers.json"]

[workspace.dependencies]
sha2 = { version = "0.11.1", default-features = false }
zhex = { git = "https://github.com/LIghtJUNction/zhex.git" }

[dependencies]
sha2.workspace = true
zhex.workspace = true
zcall = { default-features = false, features = ["server"], git = "https://github.com/LIghtJUNction/zcall.git"}
zconv = { default-features = false, git = "https://github.com/LIghtJUNction/zconv.git"}
zplugin = { features = ["std"], git = "https://github.com/LIghtJUNction/zplugin.git"}
zcalld-plugin-api = { version = "=0.4.4", path = "crates/zcalld-plugin-api" }
zcalld-compat-client = { version = "=0.4.4", path = "crates/zcalld-compat-client" }
zcalld-installer = { version = "=0.4.4", path = "crates/zcalld-installer" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
